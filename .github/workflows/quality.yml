name: Validate Stop Gastos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js
          node --check firebase-config.js
          node --input-type=module --check < firebase-sync.js
      - name: Validate JSON files
        run: |
          python -m json.tool defaults.json > /dev/null
          python -m json.tool manifest.webmanifest > /dev/null
      - name: Validate DOM bindings
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('app.js','utf8');
          const html = fs.readFileSync('index.html','utf8');
          const ids = [...js.matchAll(/\$\('#([^']+)'\)/g)].map(m => m[1]);
          const missing = [...new Set(ids)].filter(id => !html.includes('id="' + id + '"'));
          const navs = [...html.matchAll(/data-nav="([^"]+)"/g)].map(m => m[1]);
          const missingViews = [...new Set(navs)].filter(name => !html.includes('id="view-' + name + '"'));
          if (missing.length || missingViews.length) {
            console.error('Missing DOM ids:', missing);
            console.error('Missing nav views:', missingViews);
            process.exit(1);
          }
          console.log('DOM bindings OK:', new Set(ids).size, 'ids checked');
          NODE
      - name: Validate application bootstrap and auth wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js','utf8');
          const sync = fs.readFileSync('firebase-sync.js','utf8');
          const html = fs.readFileSync('index.html','utf8');

          const appFns = [...app.matchAll(/(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(m=>m[1]);
          const duplicateAppFns = [...new Set(appFns)].filter(name => appFns.filter(x=>x===name).length>1);
          if (duplicateAppFns.length) {
            console.error('Duplicate app functions:', duplicateAppFns);
            process.exit(1);
          }

          const htmlIds = [...html.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]);
          const duplicateIds = [...new Set(htmlIds)].filter(id => htmlIds.filter(x=>x===id).length>1);
          if (duplicateIds.length) {
            console.error('Duplicate HTML ids:', duplicateIds);
            process.exit(1);
          }

          const checks = [
            ['bootstrapApp exists', /function\s+bootstrapApp\s*\(/.test(app)],
            ['DOMContentLoaded bootstrap exists', /DOMContentLoaded/.test(app)],
            ['bootstrap invokes init', /Promise\.resolve\(init\(\)\)/.test(app)],
            ['Google login button exists', html.includes('id="googleLoginBtn"')],
            ['cloud login handler exists', /async\s+function\s+cloudSignIn\s*\(/.test(app)],
            ['cloud events bind Google login', /googleLoginBtn[\s\S]{0,700}cloudSignIn/.test(app)],
            ['Firebase exports signInGoogle', /\bsignInGoogle\s*,/.test(sync)],
            ['Firebase uses popup login', /signInWithPopup\(auth,provider\)/.test(sync)]
          ];

          const failed = checks.filter(([,ok])=>!ok).map(([name])=>name);
          if (failed.length) {
            console.error('Bootstrap/auth wiring failed:', failed);
            process.exit(1);
          }

          console.log('Application bootstrap and auth wiring OK');
          NODE

      - name: Check UI helper consistency
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('app.js','utf8');
          const singleSelectorHelpers = js.split('const $ = function').length - 1;
          const doubleSelectorHelpers = js.split('const $$ = function').length - 1;
          if (singleSelectorHelpers !== 1 || doubleSelectorHelpers !== 1) {
            console.error('Selector helpers invalid:', {singleSelectorHelpers, doubleSelectorHelpers});
            process.exit(1);
          }

          const forbidden = ['escapeHtml'];
          for (const name of forbidden) {
            const refs = (js.match(new RegExp('\\b' + name + '\\b','g')) || []).length;
            if (refs > 0) {
              console.error('Unexpected legacy helper reference:', name, refs);
              process.exit(1);
            }
          }
          if (!/function\s+esc\s*\(/.test(js)) {
            console.error('Expected shared esc() helper is missing');
            process.exit(1);
          }
          console.log('UI helper consistency OK');
          NODE

      - name: Validate collection selectors and state shape
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('app.js','utf8');

          const unsafeSelectors = [...js.matchAll(/(?<!\$)\$\(([^)]*)\)\.(forEach|map|filter|reduce|some|every|find)\b/g)]
            .map(m => m[0]);
          if (unsafeSelectors.length) {
            console.error('Single-element selector used as collection:', unsafeSelectors);
            process.exit(1);
          }

          const collectionFields = [...new Set(
            [...js.matchAll(/\bappState\.([A-Za-z_$][\w$]*)\.(?:forEach|map|filter|reduce|slice|find|findIndex|some|every|push|unshift|length)\b/g)]
              .map(m => m[1])
          )];

          const initStart = js.indexOf('function makeInitialState');
          const normStart = js.indexOf('function normalizeState');
          const bindStart = js.indexOf('function bindEvents');
          const initBlock = js.slice(initStart,normStart);
          const normalizeBlock = js.slice(normStart,bindStart);

          const initKeys = [...initBlock.matchAll(/^\s{4}([A-Za-z_$][\w$]*):/gm)].map(m=>m[1]);
          const normalizeKeys = [...normalizeBlock.matchAll(/^\s{4}([A-Za-z_$][\w$]*):/gm)].map(m=>m[1]);

          const missingInitial = collectionFields.filter(k => !initKeys.includes(k));
          const missingNormalize = collectionFields.filter(k => !normalizeKeys.includes(k));

          if (missingInitial.length || missingNormalize.length) {
            console.error('State shape mismatch:', {missingInitial, missingNormalize});
            process.exit(1);
          }

          console.log('Collection selectors and state shape OK');
          NODE

      - name: Validate recurring card integration
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('app.js','utf8');
          const html = fs.readFileSync('index.html','utf8');

          const checks = [
            ['recCard field exists', html.includes('id="recCard"')],
            ['recCard wrapper exists', html.includes('id="recCardWrap"')],
            ['payment change is bound', /recPayment[^\n]*addEventListener\('change',updateRecurringPaymentFields\)/.test(js)],
            ['recurring stores cardId', /cardId[\s\S]{0,120}Cartão de crédito/.test(js) || /Cartão de crédito[\s\S]{0,180}cardId/.test(js)],
            ['generated recurring transaction has cardId', /function\s+recurringTransactionData[\s\S]*cardId/.test(js)],
            ['generated recurring transaction has invoiceMonth', /function\s+recurringTransactionData[\s\S]*invoiceMonth/.test(js)]
          ];

          const failed = checks.filter(([,ok])=>!ok).map(([name])=>name);
          if (failed.length) {
            console.error('Recurring card integration failed:', failed);
            process.exit(1);
          }
          console.log('Recurring card integration OK');
          NODE

      - name: Validate shopping list module
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('app.js','utf8');
          const html = fs.readFileSync('index.html','utf8');

          const checks = [
            ['shopping view exists', html.includes('id="view-shopping"')],
            ['shopping nav exists', html.includes('data-nav="shopping"')],
            ['four summary cards exist',
              ['shoppingProductCount','shoppingItemCount','shoppingAverage','shoppingTotal'].every(id => html.includes('id="' + id + '"'))],
            ['shopping list state exists', /shoppingLists:\[\]/.test(js)],
            ['shopping state normalized', /shoppingLists:Array\.isArray\(data\.shoppingLists\)/.test(js)],
            ['shopping renderer exists', /function\s+renderShoppingLists\s*\(/.test(js)],
            ['inline pricing exists', html.includes('data-shopping-field') || /data-shopping-field/.test(js)],
            ['weighted average exists', /pricedQuantity>0\s*\?\s*total\/pricedQuantity/.test(js)],
            ['shopping autosave exists', /function\s+scheduleShoppingAutosave\s*\(/.test(js)]
          ];

          const failed = checks.filter(([,ok])=>!ok).map(([name])=>name);
          if (failed.length) {
            console.error('Shopping module validation failed:', failed);
            process.exit(1);
          }
          console.log('Shopping list module OK');
          NODE

      - name: Validate shared family shopping
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js','utf8');
          const sync = fs.readFileSync('firebase-sync.js','utf8');
          const html = fs.readFileSync('index.html','utf8');
          const rules = fs.readFileSync('firestore.rules','utf8');

          const checks = [
            ['catalog selector exists', html.includes('id="shoppingItemPreset"')],
            ['manual item option exists', app.includes("'__manual__'") && html.includes('id="shoppingManualWrap"')],
            ['catalog includes arroz 5kg', app.includes("'Arroz 5 kg'")],
            ['catalog includes açúcar 5kg', app.includes("'Açúcar 5 kg'")],
            ['catalog includes café 500g', app.includes("'Café 500 g'")],
            ['catalog includes yogurt tray', app.includes("'Bandeja de iogurte 6 unid.'")],
            ['family shared UI exists', html.includes('id="shoppingSharingBadge"')],
            ['family shopping list watcher exported', /\bwatchFamilyShoppingLists\s*,/.test(sync)],
            ['family shopping item watcher exported', /\bwatchFamilyShoppingItems\s*,/.test(sync)],
            ['family shopping save exported', /\bsaveFamilyShoppingItem\s*,/.test(sync)],
            ['app switches to family shopping', /function\s+shoppingIsFamilyShared\s*\(/.test(app)],
            ['family shopping watcher setup exists', /function\s+setupFamilyShoppingWatchers\s*\(/.test(app)],
            ['rules include shopping lists', /match \/shoppingLists\/\{listId\}/.test(rules)],
            ['rules include shopping items', /match \/items\/\{itemId\}/.test(rules)],
            ['active family members can read shopping', /shoppingLists[\s\S]{0,400}allow read: if memberOf\(familyId\)/.test(rules)]
          ];

          const failed = checks.filter(([,ok])=>!ok).map(([name])=>name);
          if (failed.length) {
            console.error('Shared family shopping validation failed:', failed);
            process.exit(1);
          }

          console.log('Shared family shopping OK');
          NODE

      - name: Validate shopping market comparison
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js','utf8');
          const sync = fs.readFileSync('firebase-sync.js','utf8');
          const html = fs.readFileSync('index.html','utf8');

          const checks = [
            ['comparison panel exists', html.includes('id="shoppingComparisonPanel"')],
            ['best market KPI exists', html.includes('id="shoppingBestMarket"')],
            ['best basket KPI exists', html.includes('id="shoppingBestBasket"')],
            ['savings KPI exists', html.includes('id="shoppingMarketSavings"')],
            ['compared products KPI exists', html.includes('id="shoppingComparedProducts"')],
            ['market ranking exists', html.includes('id="shoppingMarketBars"')],
            ['product comparison table exists', html.includes('id="shoppingProductCompareBody"')],
            ['comparison model exists', /function\s+shoppingComparisonModel\s*\(/.test(app)],
            ['product normalization exists', /function\s+shoppingProductKey\s*\(/.test(app)],
            ['family comparison fetch exported', /\bgetFamilyShoppingComparisonData\s*,/.test(sync)],
            ['family comparison refresh exists', /function\s+refreshFamilyShoppingComparison\s*\(/.test(app)],
            ['common basket uses all markets', /markets\.every\(function\(market\)\{return market\.priced\.has\(key\);\}\)/.test(app)]
          ];

          const failed = checks.filter(([,ok])=>!ok).map(([name])=>name);
          if (failed.length) {
            console.error('Shopping market comparison validation failed:', failed);
            process.exit(1);
          }

          console.log('Shopping market comparison OK');
          NODE

      - name: Validate Firestore persistence architecture
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js','utf8');
          const sync = fs.readFileSync('firebase-sync.js','utf8');
          const rules = fs.readFileSync('firestore.rules','utf8');

          const checks = [
            ['10 second debounce', /const CLOUD_SYNC_DELAY_MS = 10000;/.test(app)],
            ['no normal immediate saveVault calls', !/saveVault\(true\)/.test(app)],
            ['online reconnect does not force full sync', !/window\.addEventListener\('online'[\s\S]{0,350}forceCloudSync/.test(app)],
            ['changed sections are computed', /function\s+changedStateSections\s*\(/.test(app)],
            ['pending state persisted locally', /syncPending:cloudSyncPending===true/.test(app)],
            ['modular section list exists in Firebase adapter', /const STATE_SECTIONS = \[/.test(sync)],
            ['modular data collection exists', /users',uid,'data/.test(sync)],
            ['pushState writes changed sections', /options\.sections/.test(sync) && /batch\.set\(dataSectionRef\(section\)/.test(sync)],
            ['server-only verification exists', /pullStateFromServer/.test(sync) && /getDocsFromServer/.test(sync)],
            ['server confirms modular writes', /function\s+verifyModularWrite\s*\(/.test(sync) && /getDocFromServer\(dataSectionRef/.test(sync)],
            ['server confirms legacy fallback writes', /function\s+verifyLegacyWrite\s*\(/.test(sync) && /serverConfirmed:true/.test(sync)],
            ['legacy fallback remains available', /pushLegacyState/.test(sync) && /fallbackLegacy/.test(sync)],
            ['family state reads modular adapter', /states\[member\.uid\]=await pullState\(member\.uid\)/.test(sync)],
            ['account cleanup removes modular data', /collection\(db,'users',uid,'data'\)/.test(sync)],
            ['rules permit modular data', /match \/users\/\{userId\}\/data\/\{sectionId\}/.test(rules)],
            ['shared shopping uses 10 second delay', /function\s+scheduleShoppingAutosave[\s\S]{0,2200}CLOUD_SYNC_DELAY_MS/.test(app)]
          ];

          const failed = checks.filter(([,ok])=>!ok).map(([name])=>name);
          if (failed.length) {
            console.error('Firestore persistence architecture failed:', failed);
            process.exit(1);
          }

          console.log('Firestore persistence architecture OK');
          NODE

      - name: Validate income and benefit architecture
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js','utf8');
          const sync = fs.readFileSync('firebase-sync.js','utf8');
          const html = fs.readFileSync('index.html','utf8');
          const css = fs.readFileSync('styles.css','utf8');

          const checks = [
            ['incomeSources initial state', /incomeSources:\[\]/.test(app)],
            ['incomeSources normalized', /incomeSources:normalizeIncomeSources\(data\)/.test(app)],
            ['incomeSources Firestore section', /'incomeSources'/.test(sync)],
            ['income settings UI exists', html.includes('id="incomeSourcesGrid"')],
            ['income form exists', html.includes('id="incomeSourceForm"')],
            ['income save handler exists', /async function saveIncomeSourceForm\s*\(/.test(app)],
            ['fixed cost form has no income radio', !/name="recType"[^>]*value="income"/.test(html)],
            ['fixed costs force expense type', /async function saveRecurringForm[\s\S]{0,1800}type:'expense'/.test(app)],
            ['recurring engine generates incomeSources', /appState\.incomeSources[\s\S]{0,900}type:'income'/.test(app)],
            ['legacy recurring income migrates', /function normalizeIncomeSources[\s\S]*type==='income'/.test(app)],
            ['benefit card type field exists', html.includes('id="cardType"')],
            ['meal benefit supported', html.includes('value="meal"') && html.includes('Vale-refeição')],
            ['food benefit supported', html.includes('value="food"') && html.includes('Vale-alimentação')],
            ['fuel benefit supported', html.includes('value="fuel"') && html.includes('Vale-combustível')],
            ['benefit card logic exists', /function isBenefitCard\s*\(/.test(app)],
            ['benefit payments use cards', /function paymentUsesCard\s*\(/.test(app)],
            ['income settings responsive grid exists', /\.income-source-grid\{[\s\S]*?auto-fit/.test(css)],
            ['motion system exists', /@keyframes surfaceEnter/.test(css)],
            ['reduced motion supported', /@media\(prefers-reduced-motion:reduce\)/.test(css)]
          ];

          const failed = checks.filter(([,ok])=>!ok).map(([name])=>name);
          if (failed.length) {
            console.error('Income/benefit architecture failed:', failed);
            process.exit(1);
          }

          console.log('Income and benefit architecture OK');
          NODE

      - name: Validate income and benefit-card architecture
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js','utf8');
          const html = fs.readFileSync('index.html','utf8');
          const css = fs.readFileSync('styles.css','utf8');
          const sync = fs.readFileSync('firebase-sync.js','utf8');

          const recurringBlock = html.slice(
            html.indexOf('<form id="recurringForm"'),
            html.indexOf('<form id="incomeSourceForm"')
          );

          const checks = [
            ['incomeSources in state', /incomeSources:\[\]/.test(app)],
            ['incomeSources persisted as own section', /'incomeSources'/.test(sync)],
            ['income source settings UI exists', html.includes('id="incomeSourcesGrid"')],
            ['income source form exists', html.includes('id="incomeSourceForm"')],
            ['recurring form no income type selector', !/name="recType"/.test(recurringBlock)],
            ['recurring normalization removes old income items', /recurring:Array\.isArray\(data\.recurring\)[\s\S]{0,260}type!==['"]income['"]/.test(app)],
            ['benefit card types exist', ['meal','food','fuel','benefit'].every(type => html.includes('value="'+type+'"'))],
            ['benefit card contrast helper exists', /function\s+cardVisualTheme\s*\(/.test(app)],
            ['card renderer applies fg variable', /--card-fg:/.test(app)],
            ['credit-card CSS uses computed foreground', /color:var\(--card-fg/.test(css)],
            ['benefit background keeps card color', /benefit-card[\s\S]{0,500}var\(--card-bg/.test(css)],
            ['reduced motion supported', /prefers-reduced-motion:reduce/.test(css)]
          ];

          const failed = checks.filter(([,ok])=>!ok).map(([name])=>name);
          if (failed.length) {
            console.error('Income/benefit architecture validation failed:', failed);
            process.exit(1);
          }

          console.log('Income and benefit-card architecture OK');
          NODE

      - name: Validate save workflow
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('app.js','utf8');
          const names = [...js.matchAll(/async function (save[A-Za-z0-9_]+Form)\(/g)].map(m=>m[1]);
          const failures = [];

          for (const name of names) {
            const start = js.indexOf('async function ' + name + '(');
            const next = js.indexOf('\nasync function ', start + 1);
            const body = js.slice(start, next < 0 ? js.length : next);

            if (!body.includes('withLoading(')) failures.push(name + ': missing loader');
            if (!body.includes('commitStateChange(')) failures.push(name + ': missing optimistic commit');
            if (body.includes('await saveVault();')) failures.push(name + ': direct saveVault call');
          }

          if (failures.length) {
            console.error('Save workflow validation failed:', failures);
            process.exit(1);
          }

          console.log('Save workflow OK:', names.length, 'forms');
          NODE

      - name: Validate settings persistence and responsive layout
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js','utf8');
          const html = fs.readFileSync('index.html','utf8');
          const css = fs.readFileSync('styles.css','utf8');

          const checks = [
            ['monthly budget uses input event', /monthlyBudgetInput'\)\.addEventListener\('input',\s*handleMonthlyBudgetInput\)/.test(app)],
            ['monthly budget no longer depends on change', !/monthlyBudgetInput'\)\.addEventListener\('change'/.test(app)],
            ['monthly budget saves settings', /function\s+handleMonthlyBudgetInput[\s\S]{0,1200}appState\.settings\.monthlyBudget[\s\S]{0,1200}saveVault\(false\)/.test(app)],
            ['monthly budget status exists', html.includes('id="monthlyBudgetSaveStatus"')],
            ['Firestore data path exists', html.includes('id="cloudDataPath"')],
            ['settings persistence status renderer exists', /function\s+renderSettingsPersistenceStatus\s*\(/.test(app)],
            ['sidebar JS matches 900px CSS breakpoint', /window\.innerWidth<=900/.test(app)],
            ['tablet dashboard keeps six-column grid', /@media\(max-width:900px\)[\s\S]*?\.dashboard-optimized\{grid-template-columns:repeat\(6,minmax\(0,1fr\)\)\}/.test(css)],
            ['settings use adaptive desktop grid', /\.settings-grid\{[\s\S]*?repeat\(auto-fit,minmax\(min\(100%,340px\),1fr\)\)/.test(css)],
            ['settings cards adapt to available width', /\.settings-card\{[\s\S]*?repeat\(auto-fit,minmax\(min\(100%,260px\),1fr\)\)/.test(css)],
            ['tablet settings collapse sections to one column', /@media\(max-width:900px\)[\s\S]*?settings-grid[\s\S]*?grid-template-columns:1fr/.test(css)],
            ['mobile settings cards stack internally', /@media\(max-width:640px\)[\s\S]*?\.settings-card\{[\s\S]*?grid-template-columns:1fr/.test(css)],
            ['mobile calendar remains readable', /@media\(max-width:640px\)[\s\S]*?calendar-weekdays,.calendar-grid\{min-width:700px\}/.test(css)]
          ];

          const failed = checks.filter(([,ok])=>!ok).map(([name])=>name);
          if (failed.length) {
            console.error('Settings/responsive validation failed:', failed);
            process.exit(1);
          }
          console.log('Settings persistence and responsive layout OK');
          NODE

      - name: Validate CSS structure
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const css = fs.readFileSync('styles.css','utf8');
          const clean = css.replace(/\/\*[\s\S]*?\*\//g,'');
          let depth = 0;
          for (const ch of clean) {
            if (ch === '{') depth++;
            if (ch === '}') depth--;
            if (depth < 0) {
              console.error('CSS has an unexpected closing brace');
              process.exit(1);
            }
          }
          if (depth !== 0) {
            console.error('CSS brace balance failed:', depth);
            process.exit(1);
          }
          const roots = (clean.match(/:root\s*\{/g) || []).length;
          if (roots !== 1) {
            console.error('Expected exactly one :root block, found', roots);
            process.exit(1);
          }
          for (const bp of ['1200px','900px','640px','420px']) {
            const count = (clean.match(new RegExp('@media\\(max-width:' + bp.replace('.', '\\.') + '\\)', 'g')) || []).length;
            if (count !== 1) {
              console.error('Expected exactly one responsive breakpoint for', bp, 'found', count);
              process.exit(1);
            }
          }
          console.log('CSS structure OK');
          NODE
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s favicon.svg
          test -s manifest.webmanifest
          test -s service-worker.js
          test -s firebase-config.js
          test -s firebase-sync.js
          test -s firestore.rules
          test -s FIREBASE_SETUP.md
