name: Validate Stop Gastos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js
      - name: Validate JSON files
        run: |
          python -m json.tool defaults.json > /dev/null
          python -m json.tool manifest.webmanifest > /dev/null
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s favicon.svg
          test -s manifest.webmanifest
          test -s service-worker.js
